<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="isolate-network-title isolate-network-desc">
<title id="isolate-network-title">Isolate AI — SPN의 단말별 연결 경계</title>
<desc id="isolate-network-desc">업무 단말, 현장 기기, 센서가 각각 단말 모듈 PGW를 거쳐 기존 네트워크 위의 별도 터널로 연결됩니다. 각 터널은 게이트웨이 SGW 안의 독립 VRF를 통해 승인된 목적지로 이어집니다. 컨트롤러는 터널과 분리 정책을 관리하며 점선은 관리 관계를 나타냅니다. 물리적 전송 기반 위에서 논리적으로 구분한 연결의 개념도입니다.</desc>
<defs>
 <marker id="isolate-network-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#8AA4DA" stroke-width="1.25"/></marker>
 <pattern id="isolate-network-ground" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 18L18 0" stroke="#29354B" stroke-width=".8" opacity=".45"/></pattern>
 <linearGradient id="isolate-network-rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AEB9C9"/><stop offset=".2" stop-color="#506079"/><stop offset="1" stop-color="#152137"/></linearGradient>
</defs>
