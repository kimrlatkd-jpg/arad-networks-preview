 <marker id="connect-5g-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#8AA4DA" stroke-width="1.25" /></marker>
 <pattern id="connect-5g-en-ground" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 18L18 0" stroke="#29354B" stroke-width=".8" opacity=".45" /></pattern>
 <linearGradient id="connect-5g-en-rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AEB9C9" /><stop offset=".2" stop-color="#506079" /><stop offset="1" stop-color="#152137" /></linearGradient>
</defs>
