<title id="connect-5g-en-title">Connect AI — Site-specific private 5G</title>
<desc id="connect-5g-en-desc">An on-site private core connects by wire to a dedicated base station. Wireless links continue to mobile devices and field terminals inside the work area. Coverage and base-station placement require a site assessment.</desc>
