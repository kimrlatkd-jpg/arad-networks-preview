<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="connect-plc-title connect-plc-desc">
<title id="connect-plc-title">Connect AI — 기존 전력선을 활용하는 PLC</title>
<desc id="connect-plc-desc">지상 현장 네트워크가 PLC A에 연결됩니다. PLC A와 PLC B 사이의 데이터는 지하 구간에 설치된 기존 전력선을 통해 전달되고, PLC B가 통신선으로 현장 기기에 연결됩니다. 실제 적용 가능성은 배선 상태와 전기적 환경에 따라 확인합니다.</desc>
<defs>
 <marker id="connect-plc-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#8AA4DA" stroke-width="1.25"/></marker>
 <pattern id="connect-plc-ground" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 18L18 0" stroke="#29354B" stroke-width=".8" opacity=".45"/></pattern>
 <linearGradient id="connect-plc-rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AEB9C9"/><stop offset=".2" stop-color="#506079"/><stop offset="1" stop-color="#152137"/></linearGradient>
</defs>
<style>text{font-family:'ARAD Sans',Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.025em}path{stroke-linecap:butt;stroke-linejoin:miter}</style>
<rect width="1200" height="760" fill="#030711"/>
