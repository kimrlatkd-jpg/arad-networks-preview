e="18" fill="#9AA9BE" font-weight="400" text-anchor="end" class="">통신선</text><circle cx="519" cy="348" r="3" fill="#89C9DD"/><circle cx="819" cy="546" r="3" fill="#89C9DD"/><text x="80" y="557" font-size="21" fill="#C3CCD9" font-weight="400" text-anchor="start" class="">적용 검토</text><text x="80" y="591" font-size="20" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">새 통신 배선의 설치 여건과</text><text x="80" y="622" font-size="20" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">기존 전력선 상태를 함께 확인</text><path d="M64 674H1136" stroke="#3D4B65" stroke-width="1" fill="none" /><text x="64" y="710" font-size="18" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">현장 연결 개념도 · 적용 가능성과 통신 품질은 배선 상태 및 전기적 환경에 따라 확인합니다.</text>
