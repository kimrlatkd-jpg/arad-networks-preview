<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="connect-plc-en-title connect-plc-en-desc" lang="en">
<title id="connect-plc-en-title">Connect AI — PLC over existing power lines</title>
<desc id="connect-plc-en-desc">The site network connects to PLC A above ground. Data travels between PLC A and PLC B over an existing power line in the underground cable route. PLC B connects by a data cable to a field device. Suitability depends on cable condition and the electrical environment.</desc>
<defs>
 <marker id="connect-plc-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#8AA4DA" stroke-width="1.25" /></marker>
 <pattern id="connect-plc-en-ground" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 18L18 0" stroke="#29354B" stroke-width=".8" opacity=".45" /></pattern>
 <linearGradient id="connect-plc-en-rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AEB9C9" /><stop offset=".2" stop-color="#506079" /><stop offset="1" stop-color="#152137" /></linearGradient>
</defs>
<style>text{font-family:'ARAD Sans',Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.025em}path{stroke-linecap:butt;stroke-linejoin:miter}</style>
<rect width="1200" height="760" fill="#030711" />
<text x="64" y="68" font-size="34" fill="#F4F6FA" font-weight="400" text-anchor="start" class="">Power line communication</text><text x="64" y="108" font-size="20" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">Evaluate existing power lines where installing new communication cables is difficult.</text><text x="1136" y="67" font-size="18" fill="#C3CCD9" font-weight="400" text-anchor="end" class="">Connect AI</text><path d="M64 140H1136" stroke="#3D4B65" stroke-width="1" fill="none" /><rect x="64" y="412" width="1072" height="236" fill="#0B1322" stroke="none" stroke-width="1" /><path d="M64 410H1136" stroke="#C3CCD9" stroke-width="2" fill="none" /><rect x="64" y="413" width="1072" height="17" fill="url(#connect-plc-en-ground)" stroke="none" stroke-width="1" /><text x="80" y="222" font-size="22" fill="#C3CCD9" font-weight="400" text-anchor="start" class="">Above ground / Indoors</text><text x="80" y="477" font-size="22" fill="#C3CCD9" font-weight="400" text-anchor="start" class="">Underground / Cable route</text><rect x="80" y="270" width="224" height="100" fill="#0C1321" stroke="#3D4B65" stroke-width="1" /><rect x="80" y="270" width="5" height="100" fill="#1B2A55" stroke="none" stroke-width="1" /><path d="M96 282H288" stroke="#C3CCD9" stroke-width="0.8" fill="none" opacity=".35" /><text x="100" y="309" font-size="22" fill="#F4F6FA" font-weight="400" text-anchor="start" class="">Site network</text><text x="100" y="336" font-size="18" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">Data connection</text><path d="M304 320H446" stroke="#8AA4DA" stroke-width="10" fill="none" opacity=".025" /><path d="M304 320H446" stroke="#8AA4DA" stroke-width="5.6" fill="none" opacity=".055" /><path d="M304 320H446" stroke="#8AA4DA" stroke-width="2" fill="none" marker-end="url(#connect-plc-en-arrow)" /><text x="337" y="292" font-size="18" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">Data cable</text><rect x="446" y="292" width="146" height="56" fill="#101A2C" stroke="#6C7E9C" stroke-width="1" /><path d="M456 302H582" stroke="#C3CCD9" stroke-width="0.7" fill="none" opacity=".30" /><text x="519.0" y="328" font-size="21" fill="#F4F6FA" font-weight="400" text-anchor="middle" class="">PLC A</text><rect x="819" y="518" width="146" height="56" fill="#101A2C" stroke="#6C7E9C" stroke-width="1" /><path d="M829 528H955" stroke="#C3CCD9" stroke-width="0.7" fill="none" opacity=".30" /><text x="892.0" y="554" font-size="21" fill="#F4F6FA" font-weight="400" text-anchor="middle" class="">PLC B</text><path d="M519 348V463H708V546H819" stroke="#3D4B65" stroke-width="9" fill="none" /><path d="M519 348V463H708V546H819" stroke="#C3CCD9" stroke-width="17.5" fill="none" opacity=".025" /><path d="M519 348V463H708V546H819" stroke="#C3CCD9" stroke-width="9.799999999999999" fill="none" opacity=".055" /><path d="M519 348V463H708V546H819" stroke="#C3CCD9" stroke-width="3.5" fill="none" /><text x="590" y="450" font-size="21" fill="#C3CCD9" font-weight="400" text-anchor="start" class="">Existing power line</text><text x="742" y="466" font-size="18" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">Cable condition</text><text x="742" y="493" font-size="18" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">Electrical environment</text><path d="M965 546H1092V320H1004" stroke="#8AA4DA" stroke-width="10" fill="none" opacity=".025" /><path d="M965 546H1092V320H1004" stroke="#8AA4DA" stroke-width="5.6" fill="none" opacity=".055" /><path d="M965 546H1092V320H1004" stroke="#8AA4DA" stroke-width="2" fill="none" marker-end="url(#connect-plc-en-arrow)" /><rect x="780" y="270" width="224" height="100" fill="#0C1321" stroke="#3D4B65" stroke-width="1" /><rect x="780" y="270" width="5" height="100" fill="#1B2A55" stroke="none" stroke-width="1" /><path d="M796 282H988" stroke="#C3CCD9" stroke-width="0.8" fill="none" opacity=".35" /><text x="800" y="309" font-size="22" fill="#F4F6FA" font-weight="400" text-anchor="start" class="">Field device</text><text x="800" y="336" font-size="18" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">Data transfer</text><text x="1092" y="506" font-size="18" fill="#9AA9BE" font-weight="400" text-anchor="end" class="">Data cable</text><circle cx="519" cy="348" r="3" fill="#89C9DD" /><circle cx="819" cy="546" r="3" fill="#89C9DD" /><text x="80" y="557" font-size="21" fill="#C3CCD9" font-weight="400" text-anchor="start" class="">Site assessment</text><text x="80" y="591" font-size="20" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">Check new cable installation</text><text x="80" y="622" font-size="20" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">and existing power line condition</text><path d="M64 674H1136" stroke="#3D4B65" stroke-width="1" fill="none" /><text x="64" y="710" font-size="18" fill="#9AA9BE" font-weight="400" text-anchor="start" class="">Site concept · Suitability and connection quality depend on cabling and electrical conditions.</text>
