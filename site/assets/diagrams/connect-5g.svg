<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="connect-5g-title connect-5g-desc">
<title id="connect-5g-title">Connect AI — 현장에 맞춘 5G 전용망</title>
<desc id="connect-5g-desc">현장 내부의 전용망 코어가 유선으로 전용 기지국에 연결되고, 기지국에서 실내 이동 기기와 현장 단말로 무선 연결이 이어지는 건물 단면입니다. 전파 도달 범위와 기지국 배치는 현장 조사 후 결정합니다.</desc>
<defs>
 <marker id="connect-5g-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#8AA4DA" stroke-width="1.25"/></marker>
 <pattern id="connect-5g-ground" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 18L18 0" stroke="#29354B" stroke-width=".8" opacity=".45"/></pattern>
 <linearGradient id="connect-5g-rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AEB9C9"/><stop offset=".2" stop-color="#506079"/><stop offset="1" stop-color="#152137"/></linearGradient>
</defs>
