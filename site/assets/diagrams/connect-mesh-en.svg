<title id="connect-mesh-en-title">Connect AI — Wi-Fi mesh access points</title>
<desc id="connect-mesh-en-desc">The existing site network connects to access point A, which relays wireless links to access points B and C in adjacent work areas. B and C also have a connecting route. The routes shown are illustrative and depend on obstacles and the radio environment.</desc>
