<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="isolate-network-en-title isolate-network-en-desc" lang="en">
<title id="isolate-network-en-title">Isolate AI — Per-device connection boundaries with SPN</title>
<desc id="isolate-network-en-desc">A workstation, a field device and a sensor each connect through a PGW device module and a separate tunnel on the existing network. Each tunnel passes through its own VRF inside the SGW gateway to an approved destination. The controller manages tunnels and separation policies; its dashed line represents management, not a data path. This is a concept of logical separation on shared transport infrastructure.</desc>
<defs>
 <marker id="isolate-network-en-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#8AA4DA" stroke-width="1.25" /></marker>
 <pattern id="isolate-network-en-ground" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 18L18 0" stroke="#29354B" stroke-width=".8" opacity=".45" /></pattern>
 <linearGradient id="isolate-network-en-rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AEB9C9" /><stop offset=".2" stop-color="#506079" /><stop offset="1" stop-color="#152137" /></linearGradient>
</defs>
